<!-- 
1.1 HTML stands for hyper text markup language. It acts as the structure/base for webpages while css styles and javascript gives interactivity.
1.2 1991: HTML was created by Tim Berners-Lee.
    1995: HTML 2.0 was introduced.
    1997: HTML 4.0 was featured with tables and forms.
    2014: HTML 5.0 was introduced featuring audio, video, semantic elements and much more.
1.3 HTML is used for creating the base structure 
    adding audio video elements providing forms to get user input
    organize content into sections and form a bridge between webpage and browser.
2   <!doctype HTML>: is used to denote that the following lines are HTML 5 to the browser to render.
    <HTML>: It is a root element. It wraps every webpage element within.
    <head>: It usually contains title, css style, character encoders, javascript.
    <body>: It contains everything the user sees. Audio, video, images, forms, tables, buttons, external links.
3   <div>: It is generally a container used to group items. Usually used for styling any group of elements.
    <section>: It represents a thematic similar group of elements. Usually contains Heading and are related to it.
-->        

<!doctype html>
<html>
    <head>
        <title>Random Page</title>
        <style>
            #heading
            {
                text-align: center;
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <h1 id="heading">Random Paragraph</h1>
        <br/><br/>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Unde, blanditiis. Quasi incidunt, excepturi veritatis maiores temporibus quo atque voluptatem quam commodi laudantium natus. Voluptatibus, ab quasi assumenda dolorem repudiandae reiciendis.</p>
    </body>
</html>
